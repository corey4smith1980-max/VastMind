kind = "web"
previewPath = "/"
title = "VastMind"
description = "VastMind brings private chats, creator videos, communities, channels, and everyday business conversations together."
version = "1.0.0"
id = "artifacts/neura-connect"
router = "path"

[[services]]
name = "web"
paths = ["/", "/_next/webpack-hmr"]
localPort = 22088

[services.development]
run = "pnpm --filter @workspace/neura-connect run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/neura-connect", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/neura-connect", "run", "serve"]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "22088"
BASE_PATH = ""
