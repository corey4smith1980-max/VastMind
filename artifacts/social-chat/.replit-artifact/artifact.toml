kind = "mobile"
previewPath = "/"
title = "VastMind Mobile"
description = "VastMind connects private messaging, business conversations, social feeds, groups, and channels on mobile."
version = "1.0.0"
id = "artifacts/social-chat"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = ["/"]
localPort = 20437

[services.development]
run = "pnpm --filter @workspace/social-chat run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/social-chat", "run", "build"]
run = ["pnpm", "--filter", "@workspace/social-chat", "run", "serve"]

[services.env]
PORT = "20437"
BASE_PATH = "/"
