openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: NeuraCoreConnect API for profiles, messaging, communities, channels, and social activity.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: API health checks
  - name: profile
    description: Member profiles and privacy controls
  - name: users
    description: Member discovery and safety
  - name: chats
    description: Direct and group conversations
  - name: feed
    description: Social posts and reactions
  - name: communities
    description: Public and private communities
  - name: channels
    description: Followable broadcast channels
  - name: statuses
    description: 24-hour text statuses
  - name: business
    description: Business inbox tools
  - name: notifications
    description: In-app notifications
paths:
  /commerce/shops:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops"
  /commerce/shops/{shopId}:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}"
  /commerce/shops/{shopId}/follow:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}~1follow"
  /commerce/shops/{shopId}/team:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}~1team"
  /commerce/products:
    $ref: "./commerce.yaml#/paths/~1commerce~1products"
  /commerce/products/{productId}:
    $ref: "./commerce.yaml#/paths/~1commerce~1products~1{productId}"
  /commerce/products/{productId}/save:
    $ref: "./commerce.yaml#/paths/~1commerce~1products~1{productId}~1save"
  /commerce/products/{productId}/reviews:
    $ref: "./commerce.yaml#/paths/~1commerce~1products~1{productId}~1reviews"
  /commerce/reports:
    $ref: "./commerce.yaml#/paths/~1commerce~1reports"
  /commerce/quote:
    $ref: "./commerce.yaml#/paths/~1commerce~1quote"
  /commerce/orders:
    $ref: "./commerce.yaml#/paths/~1commerce~1orders"
  /commerce/orders/{orderId}:
    $ref: "./commerce.yaml#/paths/~1commerce~1orders~1{orderId}"
  /commerce/shops/{shopId}/coupons:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}~1coupons"
  /commerce/coupons/{couponId}:
    $ref: "./commerce.yaml#/paths/~1commerce~1coupons~1{couponId}"
  /commerce/shops/{shopId}/campaigns:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}~1campaigns"
  /commerce/campaigns/{campaignId}:
    $ref: "./commerce.yaml#/paths/~1commerce~1campaigns~1{campaignId}"
  /commerce/shops/{shopId}/dashboard:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}~1dashboard"
  /commerce/shops/{shopId}/customers:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}~1customers"
  /commerce/shops/{shopId}/customers/{userId}:
    $ref: "./commerce.yaml#/paths/~1commerce~1shops~1{shopId}~1customers~1{userId}"
  /commerce/content/{postId}/products:
    $ref: "./commerce.yaml#/paths/~1commerce~1content~1{postId}~1products"
  /commerce/events:
    $ref: "./commerce.yaml#/paths/~1commerce~1events"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMyProfile
      tags: [profile]
      summary: Get the signed-in member's profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateMyProfile
      tags: [profile]
      summary: Update the signed-in member's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /me/privacy:
    put:
      operationId: updatePrivacySettings
      tags: [profile]
      summary: Update member privacy controls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacySettingsInput"
      responses:
        "200":
          description: Updated privacy settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search members by name or username
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Matching members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /users/{userId}/block:
    delete:
      operationId: unblockUser
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member unblocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResult"
    post:
      operationId: blockUser
      tags: [users]
      summary: Block a member
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Block status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResult"
  /users/blocked:
    get:
      operationId: listBlockedUsers
      tags: [users]
      responses:
        "200":
          description: Blocked members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /users/suggestions:
    get:
      operationId: getSuggestedPeople
      tags: [users]
      summary: Discover people ranked by shared communities
      responses:
        "200":
          description: Suggested members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /users/{userId}/follow:
    post:
      operationId: toggleUserFollow
      tags: [users]
      summary: Follow or unfollow a member
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Updated follow relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserFollowResult"
  /users/{userId}/reports:
    post:
      operationId: reportUser
      tags: [users]
      summary: Report a member for review
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
  /chats:
    get:
      operationId: listChats
      tags: [chats]
      summary: List the signed-in member's conversations
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationList"
    post:
      operationId: createChat
      tags: [chats]
      summary: Start a direct or group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /chats/{chatId}/messages:
    get:
      operationId: getChatMessages
      tags: [chats]
      summary: List messages in a conversation
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: before
          required: false
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
      responses:
        "200":
          description: Message history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
    post:
      operationId: sendMessage
      tags: [chats]
      summary: Send a text message
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /chats/{chatId}/messages/{messageId}/reactions:
    post:
      operationId: toggleMessageReaction
      tags: [chats]
      summary: Toggle an emoji reaction on a message
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - in: path
          name: messageId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageReactionInput"
      responses:
        "200":
          description: Updated emoji reactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReactionResult"
  /chats/{chatId}/read:
    post:
      operationId: markChatRead
      tags: [chats]
      summary: Mark the conversation as read
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Read state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
  /chats/{chatId}/members:
    post:
      operationId: addChatMember
      tags: [chats]
      summary: Add a member to a group conversation
      parameters:
        - $ref: "#/components/parameters/ChatId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMemberInput"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /chats/{chatId}/members/{userId}:
    delete:
      operationId: removeChatMember
      tags: [chats]
      summary: Remove a member from a group conversation
      parameters:
        - $ref: "#/components/parameters/ChatId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /chats/{chatId}/leave:
    post:
      operationId: leaveChat
      tags: [chats]
      summary: Leave a group conversation
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Membership ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
  /chats/{chatId}/invite:
    post:
      operationId: createChatInvite
      tags: [chats]
      summary: Create or retrieve a group invite link
      parameters:
        - $ref: "#/components/parameters/ChatId"
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResult"
  /invites/{inviteCode}/join:
    post:
      operationId: acceptChatInvite
      tags: [chats]
      parameters:
        - in: path
          name: inviteCode
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Joined conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get the member feed
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: communityId
          required: false
          schema:
            type: string
        - in: query
          name: before
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
  /videos:
    get:
      operationId: getVideos
      tags: [feed]
      summary: List visible clips or the combined posts-and-clips timeline
      parameters:
        - in: query
          name: before
          required: false
          schema: { type: string, maxLength: 160 }
        - in: query
          name: feed
          schema: { type: string, enum: [for-you, following, latest] }
        - in: query
          name: creatorId
          schema: { type: string, maxLength: 160 }
        - in: query
          name: includePosts
          description: Include text, photo and poll posts alongside clips in one timeline.
          schema: { type: boolean }
        - in: query
          name: q
          schema: { type: string, maxLength: 200 }
        - in: query
          name: communityId
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: Videos and the next paging cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
  /creators/{userId}:
    get:
      operationId: getCreator
      tags: [feed]
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Privacy-checked creator profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatorProfile" }
  /videos/{postId}/engagement:
    post:
      operationId: recordVideoEngagement
      tags: [feed]
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watchMs, completed]
              properties:
                watchMs: { type: integer, minimum: 0, maximum: 90000 }
                completed: { type: boolean }
      responses:
        "200":
          description: Engagement saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResult" }
  /videos/history:
    delete:
      operationId: resetVideoHistory
      tags: [feed]
      responses:
        "200":
          description: Viewing history and recommendation sessions cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResult" }
  /video-tools/capabilities:
    get:
      operationId: getVideoCapabilities
      tags: [feed]
      responses:
        "200":
          description: Available video processing services
          content:
            application/json:
              schema:
                type: object
                required: [rendering, transcription, musicCatalog]
                properties:
                  rendering: { type: boolean }
                  transcription: { type: boolean }
                  musicCatalog: { type: string, enum: [upload-only] }
  /video-tools/render:
    post:
      operationId: renderVideo
      tags: [feed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId, start, end]
              properties:
                mediaId: { type: string, maxLength: 160 }
                audioMediaId: { type: string, maxLength: 160 }
                start: { type: number, minimum: 0, maximum: 89.9 }
                end: { type: number, minimum: 0.1, maximum: 90 }
                speed: { type: number, enum: [0.5, 1, 1.5, 2], default: 1 }
                aspect: { type: string, enum: [original, portrait, square], default: original }
                effect: { type: string, enum: [none, warm, mono, soft], default: none }
                mirror: { type: boolean, default: false }
                originalVolume: { type: number, minimum: 0, maximum: 1, default: 1 }
                musicVolume: { type: number, minimum: 0, maximum: 1, default: 0.5 }
      responses:
        "200":
          description: Rendered private video upload ready for publishing as a post
          content:
            application/json:
              schema:
                type: object
                required: [media, durationSeconds]
                properties:
                  media: { $ref: "#/components/schemas/MediaAttachment" }
                  durationSeconds: { type: number }
  /video-tools/captions:
    post:
      operationId: transcribeVideo
      tags: [feed]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              properties:
                mediaId: { type: string, maxLength: 160 }
      responses:
        "200":
          description: AI-generated timed captions; review before posting
          content:
            application/json:
              schema:
                type: object
                required: [captions, text]
                properties:
                  captions: { type: array, items: { $ref: "#/components/schemas/CaptionCue" } }
                  text: { type: string }
  /posts:
    post:
      operationId: createPost
      tags: [feed]
      summary: Publish a post, clip, or poll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{postId}/reactions:
    post:
      operationId: togglePostReaction
      tags: [feed]
      summary: Add or remove a reaction
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionInput"
      responses:
        "200":
          description: Updated post reaction count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResult"
  /posts/{postId}/comments:
    get:
      operationId: listPostComments
      tags: [feed]
      parameters:
        - $ref: "#/components/parameters/PostId"
      responses:
        "200":
          description: Post comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
    post:
      operationId: addPostComment
      tags: [feed]
      summary: Comment on a post
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /posts/{postId}/vote:
    post:
      operationId: voteOnPoll
      tags: [feed]
      parameters:
        - $ref: "#/components/parameters/PostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollVoteInput"
      responses:
        "200":
          description: Updated poll post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /communities:
    get:
      operationId: listCommunities
      tags: [communities]
      summary: Discover communities
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
        - in: query
          name: category
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Communities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityList"
    post:
      operationId: createCommunity
      tags: [communities]
      summary: Create a community
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityInput"
      responses:
        "201":
          description: Created community
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Community"
  /communities/{communityId}/join:
    post:
      operationId: joinCommunity
      tags: [communities]
      summary: Join a public community or request private membership
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Membership state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
  /communities/{communityId}/requests:
    get:
      operationId: listCommunityRequests
      tags: [communities]
      parameters:
        - in: path
          name: communityId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pending membership requests, visible to the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
  /communities/{communityId}/requests/{userId}:
    post:
      operationId: decideCommunityRequest
      tags: [communities]
      parameters:
        - in: path
          name: communityId
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipDecisionInput"
      responses:
        "200":
          description: Membership decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
  /channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: Browse channels
      parameters:
        - in: query
          name: q
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Public channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
    post:
      operationId: createChannel
      tags: [channels]
      summary: Create a broadcast channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelInput"
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
  /channels/{channelId}/follow:
    post:
      operationId: toggleChannelFollow
      tags: [channels]
      summary: Follow or unfollow a channel
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated channel subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResult"
  /channels/{channelId}/updates:
    get:
      operationId: listChannelUpdates
      tags: [channels]
      parameters:
        - in: path
          name: channelId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Channel history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelUpdateList"
    post:
      operationId: publishChannelUpdate
      tags: [channels]
      summary: Publish a channel update
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdateInput"
      responses:
        "201":
          description: Published update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelUpdate"
  /channels/{channelId}/updates/{updateId}/pin:
    post:
      operationId: togglePinnedUpdate
      tags: [channels]
      summary: Pin or unpin a channel update
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            type: string
        - in: path
          name: updateId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated channel update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelUpdate"
  /push/config:
    get:
      operationId: getPushConfig
      tags: [notifications]
      summary: Check web push configuration
      responses:
        "200":
          description: Configuration without private credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfiguration"
  /push/subscription:
    post:
      operationId: savePushSubscription
      tags: [notifications]
      summary: Register this browser for private closed-app alerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
    delete:
      operationId: removePushSubscription
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushEndpointInput"
      responses:
        "200":
          description: Unregistered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [media]
      summary: Reserve a private media upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "200":
          description: Direct upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadTicket"
  /storage/uploads/{mediaId}/complete:
    post:
      operationId: completeMediaUpload
      tags: [media]
      summary: Verify and seal uploaded media
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAttachment"
  /storage/media/{mediaId}:
    get:
      operationId: getMediaContent
      tags: [media]
      summary: Read media after checking conversation or story permissions
      parameters:
        - in: path
          name: mediaId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Private media bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /statuses:
    get:
      operationId: listStatuses
      tags: [statuses]
      summary: List unexpired text statuses
      responses:
        "200":
          description: Active statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusList"
    post:
      operationId: createStatus
      tags: [statuses]
      summary: Publish a text status that expires after 24 hours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusInput"
      responses:
        "201":
          description: Created status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /shop/products:
    get:
      operationId: listShopProducts
      tags: [business]
      summary: Browse published products or the current user's listings
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: sellerId
          schema: { type: string }
        - in: query
          name: scope
          schema: { type: string, enum: [discover, mine], default: discover }
      responses:
        "200":
          description: Shop products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProductList"
    post:
      operationId: createShopProduct
      tags: [business]
      summary: Create a product listing for the signed-in seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
  /shop/products/{productId}:
    patch:
      operationId: updateShopProduct
      tags: [business]
      summary: Update or archive a seller's product
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopProduct"
  /shop/orders:
    get:
      operationId: listShopOrders
      tags: [business]
      summary: List buyer or seller orders
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [buyer, seller], default: buyer }
      responses:
        "200":
          description: Orders visible to the signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrderList"
    post:
      operationId: placeShopOrder
      tags: [business]
      summary: Place an order from one seller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopOrderInput"
      responses:
        "201":
          description: Order placed and awaiting manual payment arrangement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
  /shop/orders/{orderId}:
    patch:
      operationId: updateShopOrder
      tags: [business]
      summary: Update order status or record manual payment confirmation
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopOrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopOrder"
  /business/overview:
    get:
      operationId: getBusinessOverview
      tags: [business]
      summary: Get business inbox summary
      responses:
        "200":
          description: Business inbox summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOverview"
  /business/quick-replies:
    get:
      operationId: listQuickReplies
      tags: [business]
      summary: List saved business replies
      responses:
        "200":
          description: Saved replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickReplyList"
    post:
      operationId: createQuickReply
      tags: [business]
      summary: Save a business quick reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickReplyInput"
      responses:
        "201":
          description: Saved reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickReply"
  /business/status:
    patch:
      operationId: updateBusinessStatus
      tags: [business]
      summary: Set business availability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessStatusInput"
      responses:
        "200":
          description: Updated business status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessOverview"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List recent in-app notifications
      responses:
        "200":
          description: Recent notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification read state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadResult"
  /mail/account:
    get:
      operationId: getMailAccount
      tags: [mail]
      summary: Get the signed-in user's internal VastMind mail address and public-key status
      responses:
        "200":
          description: Internal mail account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailAccount"
  /mail/keys:
    put:
      operationId: registerMailKeys
      tags: [mail]
      summary: Register immutable public encryption and signing keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailKeysInput"
      responses:
        "200":
          description: Public keys registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailAccount"
  /mail/recipients:
    get:
      operationId: searchMailRecipients
      tags: [mail]
      summary: Search existing VastMind users who have activated internal mail
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
      responses:
        "200":
          description: Internal mail recipients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailContactList"
  /mail/threads:
    get:
      operationId: listMailThreads
      tags: [mail]
      summary: List the signed-in user's internal mail threads
      parameters:
        - in: query
          name: box
          schema: { type: string, enum: [inbox, sent, archived], default: inbox }
      responses:
        "200":
          description: Mailbox thread summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailThreadList"
    post:
      operationId: createMailThread
      tags: [mail]
      summary: Start an internal mail thread using a username@vastmind.com address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailThreadInput"
      responses:
        "201":
          description: Internal mail thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailThread"
  /mail/threads/{threadId}/messages:
    get:
      operationId: listMailMessages
      tags: [mail]
      summary: List ciphertext envelopes addressed to the signed-in member
      parameters:
        - in: path
          name: threadId
          required: true
          schema: { type: string }
        - in: query
          name: before
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
      responses:
        "200":
          description: Encrypted mail history page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessagePage"
    post:
      operationId: sendMailMessage
      tags: [mail]
      summary: Store one encrypted message envelope per thread member
      parameters:
        - in: path
          name: threadId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailMessageInput"
      responses:
        "201":
          description: Encrypted mail message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailMessage"
  /mail/threads/{threadId}/read:
    patch:
      operationId: markMailThreadRead
      tags: [mail]
      summary: Update the member's internal mail read receipt
      parameters:
        - in: path
          name: threadId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Read state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailReadResult"
  /mail/threads/{threadId}/archive:
    patch:
      operationId: setMailThreadArchived
      tags: [mail]
      summary: Archive or restore a thread for the signed-in member
      parameters:
        - in: path
          name: threadId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MailArchiveInput"
      responses:
        "200":
          description: Archive state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailArchiveResult"
components:
  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
    ChatId:
      in: path
      name: chatId
      required: true
      schema:
        type: string
    PostId:
      in: path
      name: postId
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required: [id, name, username, bio, status, online, privacy]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        email: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
        online: { type: boolean }
        privacy:
          $ref: "#/components/schemas/PrivacySettings"
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        username: { type: string, minLength: 3, maxLength: 32, pattern: "^[A-Za-z0-9_]+$" }
        bio: { type: ["string", "null"], maxLength: 280 }
        status: { type: ["string", "null"], maxLength: 80 }
        avatarUrl: { type: ["string", "null"] }
    PrivacySettings:
      type: object
      required: [allowMessagesFrom, profileVisibility, showOnlineStatus, showLastSeen]
      properties:
        allowMessagesFrom: { type: string, enum: [everyone, contacts, nobody] }
        profileVisibility: { type: string, enum: [everyone, contacts, nobody] }
        showOnlineStatus: { type: boolean }
        showLastSeen: { type: boolean }
    PrivacySettingsInput:
      type: object
      required: [allowMessagesFrom, profileVisibility, showOnlineStatus, showLastSeen]
      properties:
        allowMessagesFrom: { type: string, enum: [everyone, contacts, nobody] }
        profileVisibility: { type: string, enum: [everyone, contacts, nobody] }
        showOnlineStatus: { type: boolean }
        showLastSeen: { type: boolean }
    UserSummary:
      type: object
      required: [id, name, username, avatarUrl, online, mutualCommunities, following]
      properties:
        id: { type: string }
        name: { type: string }
        username: { type: string }
        avatarUrl: { type: ["string", "null"] }
        online: { type: boolean }
        mutualCommunities: { type: integer }
        following: { type: boolean }
        lastSeenAt: { type: ["string", "null"], format: date-time }
    UserFollowResult:
      type: object
      required: [following]
      properties:
        following: { type: boolean }
    UserList:
      type: array
      items:
        $ref: "#/components/schemas/UserSummary"
    BlockResult:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }
    ReportInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ReportResult:
      type: object
      required: [submitted]
      properties:
        submitted: { type: boolean }
    ConversationMember:
      type: object
      required: [user, role, joinedAt]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        role: { type: string, enum: [owner, admin, member] }
        joinedAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, type, name, isPrivate, members, memberCount, lastMessage, lastMessageAt, unreadCount, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [private, group] }
        name: { type: ["string", "null"] }
        isPrivate: { type: boolean }
        inviteCode: { type: ["string", "null"] }
        members:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMember"
        memberCount: { type: integer }
        lastMessage: { type: ["string", "null"] }
        lastMessageAt: { type: ["string", "null"], format: date-time }
        unreadCount: { type: integer }
        createdAt: { type: string, format: date-time }
    ConversationList:
      type: array
      items:
        $ref: "#/components/schemas/Conversation"
    ChatInput:
      type: object
      required: [type, memberIds]
      properties:
        type: { type: string, enum: [private, group] }
        name: { type: ["string", "null"], maxLength: 80 }
        isPrivate: { type: boolean, default: true }
        memberIds:
          type: array
          minItems: 1
          items: { type: string }
    ChatMemberInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    Message:
      type: object
      required: [id, chatId, senderId, senderName, senderAvatarUrl, content, type, createdAt, readBy, reactions]
      properties:
        id: { type: string }
        chatId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        senderAvatarUrl: { type: ["string", "null"] }
        content: { type: string }
        type: { type: string, enum: [text, system, image, video, voice, sticker] }
        media:
          $ref: "#/components/schemas/MediaAttachment"
        createdAt: { type: string, format: date-time }
        readBy:
          type: array
          items: { type: string }
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/MessageReaction"
    MessageList:
      type: object
      required: [items, nextBefore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        nextBefore: { type: ["string", "null"], format: date-time }
    MessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
        replyToId: { type: ["string", "null"] }
        mediaId: { type: string }
        type: { type: string, enum: [text, sticker] }
    MessageReaction:
      type: object
      required: [emoji, count, reactedByMe]
      properties:
        emoji: { type: string }
        count: { type: integer }
        reactedByMe: { type: boolean }
    MessageReactionInput:
      type: object
      required: [emoji]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 16 }
    MessageReactionResult:
      type: object
      required: [reactions]
      properties:
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/MessageReaction"
    ReadResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    InviteResult:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string }
        inviteUrl: { type: string }
    Post:
      type: object
      required: [id, author, content, createdAt, reactionsCount, reacted, commentsCount, communityId, communityName, pollOptions, media, audioMedia, effect, isAnonymous]
      properties:
        id: { type: string }
        author:
          $ref: "#/components/schemas/UserSummary"
        content: { type: string }
        createdAt: { type: string, format: date-time }
        reactionsCount: { type: integer }
        reacted: { type: boolean }
        commentsCount: { type: integer }
        communityId: { type: ["string", "null"] }
        communityName: { type: ["string", "null"] }
        pollOptions:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
        media:
          anyOf:
            - $ref: "#/components/schemas/MediaAttachment"
            - type: "null"
        audioMedia:
          anyOf:
            - $ref: "#/components/schemas/MediaAttachment"
            - type: "null"
        effect: { type: string, enum: [none, warm, mono, soft] }
        isAnonymous: { type: boolean }
        captions:
          type: array
          items: { $ref: "#/components/schemas/CaptionCue" }
    CaptionCue:
      type: object
      required: [start, end, text]
      properties:
        start: { type: number, minimum: 0, maximum: 90 }
        end: { type: number, minimum: 0, maximum: 90 }
        text: { type: string, maxLength: 500 }
    CreatorProfile:
      type: object
      required: [user, bio, followersCount, followingCount, clipsCount]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        bio: { type: string }
        followersCount: { type: integer }
        followingCount: { type: integer }
        clipsCount: { type: integer }
    SuccessResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    PollOption:
      type: object
      required: [id, label, votes, votedByMe]
      properties:
        id: { type: string }
        label: { type: string }
        votes: { type: integer }
        votedByMe: { type: boolean }
    PostList:
      type: array
      items:
        $ref: "#/components/schemas/Post"
    VideoPage:
      type: object
      required: [items, nextBefore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        nextBefore: { type: ["string", "null"] }
    PostInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 0
          maxLength: 5000
          description: Caption or poll question. May be empty only for an ordinary photo post; polls require a question.
        communityId: { type: ["string", "null"] }
        pollOptions:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        mediaId:
          type: string
          description: A ready, owned post upload. Photos may accompany polls; video and audio may not.
        audioMediaId: { type: string }
        effect: { type: string, enum: [none, warm, mono, soft] }
        isAnonymous: { type: boolean, default: false }
        captions:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/CaptionCue" }
    ReactionInput:
      type: object
      required: [reaction]
      properties:
        reaction: { type: string, enum: [like, love, celebrate, support, laugh] }
    ReactionResult:
      type: object
      required: [reacted, reactionsCount]
      properties:
        reacted: { type: boolean }
        reactionsCount: { type: integer }
    Comment:
      type: object
      required: [id, postId, author, content, createdAt]
      properties:
        id: { type: string }
        postId: { type: string }
        author:
          $ref: "#/components/schemas/UserSummary"
        content: { type: string }
        createdAt: { type: string, format: date-time }
    CommentInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
    Community:
      type: object
      required: [id, ownerId, name, description, category, isPrivate, memberCount, membership, createdAt]
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        isPrivate: { type: boolean }
        memberCount: { type: integer }
        membership: { type: string, enum: [none, member, requested] }
        createdAt: { type: string, format: date-time }
    CommunityList:
      type: array
      items:
        $ref: "#/components/schemas/Community"
    CommunityInput:
      type: object
      required: [name, description, category, isPrivate]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, minLength: 2, maxLength: 500 }
        category: { type: string, minLength: 2, maxLength: 40 }
        isPrivate: { type: boolean }
    JoinResult:
      type: object
      required: [membership, memberCount]
      properties:
        membership: { type: string, enum: [none, member, requested, followed] }
        memberCount: { type: integer }
    Channel:
      type: object
      required: [id, name, description, owner, subscriberCount, followed, pinnedUpdate, latestUpdate, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        owner:
          $ref: "#/components/schemas/UserSummary"
        subscriberCount: { type: integer }
        followed: { type: boolean }
        pinnedUpdate:
          anyOf:
            - $ref: "#/components/schemas/ChannelUpdate"
            - type: "null"
        latestUpdate:
          anyOf:
            - $ref: "#/components/schemas/ChannelUpdate"
            - type: "null"
        createdAt: { type: string, format: date-time }
    ChannelList:
      type: array
      items:
        $ref: "#/components/schemas/Channel"
    ChannelInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, minLength: 2, maxLength: 500 }
    ChannelUpdate:
      type: object
      required: [id, channelId, content, pinned, createdAt]
      properties:
        id: { type: string }
        channelId: { type: string }
        content: { type: string }
        pinned: { type: boolean }
        createdAt: { type: string, format: date-time }
    ChannelUpdateInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
    Status:
      type: object
      required: [id, author, content, backgroundStyle, createdAt, expiresAt]
      properties:
        id: { type: string }
        author:
          $ref: "#/components/schemas/UserSummary"
        content: { type: string }
        backgroundStyle:
          type: string
          enum: [midnight, sunset, berry, ocean, aurora, coral, forest, plum]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        media:
          $ref: "#/components/schemas/MediaAttachment"
    StatusList:
      type: array
      items:
        $ref: "#/components/schemas/Status"
    StatusInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        mediaId: { type: string }
        backgroundStyle:
          type: string
